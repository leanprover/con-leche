# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for Lech.  Kept deliberately short: only
# the schema's required fields plus what the Palomar registry asks for.
version: "v0.4"

project:
  name: "Lech"
  description: >-
    A checker for Lean's declaration export format, written and verified
    in Lean.  The main theorem: if the checker in its default `--verified`
    mode accepts a stream of declarations, the resulting environment
    contains no constant of type `False`.
  authors:
    - "Joachim Breitner"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joachim Breitner"

classification:
  arxiv: ["cs.LO"]
  msc2020: ["03B35", "68V15"]

sources:
  - title: "Soundness of the Lech checker"
    type: original-proof
    relationship: other
    note: "An original result about this project's own checker."
  - title: "The Type Theory of Lean"
    authors:
      - "Mario Carneiro"
    type: paper
    id: "https://github.com/digama0/lean-type-theory"
    location: "MSc thesis, Carnegie Mellon University, 2019"
    relationship: background
    note: "The set-theoretic model construction this project follows."
  - title: "lean4lean"
    authors:
      - "Mario Carneiro"
    type: other
    id: "https://github.com/digama0/lean4lean"
    relationship: background
    note: "A Lean typechecker in Lean, used for comparison; no code shared."

related_formalizations:
  - id: "https://github.com/digama0/lean4lean"
    relationship: "independent"

status:
  scope: >-
    Covered: `Lech.no_proof_of_False` is stated about
    `Lech.Cached.checkDeclsSPCachedD (cfgOf .verified)`, the function
    the `lech` binary runs on the parsed export.  Not covered: the
    parser, the `--trusted` mode.  The proof is parametric in a type
    satisfying the `SetTheory` interface (ZF without infinity and choice
    plus an omega-chain of Grothendieck universes); the conclusion is
    syntactic (the constant's type is literally the pinned `False`).
  # The only `sorry` in the repository is the deliberate hole in the
  # Comparator challenge module `Lech/Challenge.lean`.
  sorry_count: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Lech.no_proof_of_False"
      file: "Lech/MainTheorem.lean"
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models:
        - "Claude (Anthropic)"
      framework: "Claude Code"
    - method: "manual"
  notes: >-
    Implemented and proved by Claude agents.  The human maintainer
    intensively discussed design and steps with the agents.  Gates in
    the repository pin the axioms of the main theorem and fail the
    build on any compiler escape outside a justified allowlist.

fidelity:
  divergences: >-
    The checker differs from the official Lean kernel in a few places
    (see README.md); it declines on unsupported features, and the
    theorem speaks only about acceptance.

review:
  status: "self-assessed"

acknowledgements: >-
  Mario Carneiro, for "The Type Theory of Lean" and lean4lean.
