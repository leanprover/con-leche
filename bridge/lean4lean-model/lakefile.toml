# The lean4lean-model bridge (task #204): Carneiro's `OmegaInaccessibles`
# hypothesis implies Lech's `SetTheory` interface.  A SEPARATE Lake package
# so that the Lech libraries never gain a Mathlib dependency (build time,
# trust surface, layering); see README.md here and DESIGN.md task #204.
name = "lech-bridge-lean4lean-model"
defaultTargets = ["LechBridge"]

# Mathlib first on purpose (lean4lean-model's own lakefile does the same):
# Lake resolves a shared transitive dependency to the first pin it meets.
# The tag matches `lean-toolchain` (v4.33.0), which is a copy of Lech's.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

# Lech itself, by path: the bridge imports `Lech.SetTheory.Core` only.
[[require]]
name = "lech"
path = "../.."

[[lean_lib]]
name = "LechBridge"
