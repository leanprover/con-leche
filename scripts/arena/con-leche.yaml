description: |
  **con-leche** — a Lean 4 kernel checker written in Lean 4 and *verified* against
  a set-theoretic model: the shipped `--verified` configuration is the one the
  consistency capstone (`ConLeche.no_False_theorem_accepted`) is stated about, so an
  accepted stream comes with a machine-checked argument that the checked
  declarations have a model, and in particular that no `False` was proved.

  The binary ingests raw `lean4export` NDJSON: there is no preprocessor, no
  external dependency and no spawn.  Every inductive block is installed by a
  direct route — structures, sums, indexed families, finitary fixed points,
  reflexive blocks — or through a `_model` family the frontend generates
  **in-process** at parse time and then checks as ordinary declarations of the
  stream.  That generator is not trusted: a wrong generated record is rejected
  or declined by the fold, never accepted, so it decides coverage only.  A
  block no route takes declines (exit 2) naming its class.

  Exit codes follow the arena convention exactly: 0 accept, 1 reject, 2 decline
  (only when the checker *positively detects* a feature it does not support
  yet), 3 error.  An out-of-memory panic in the checking process is translated
  into 3 by an in-binary supervisor rather than being reported as a rejection.

  This definition is the *local* one used by `scripts/arena/run-suite.sh` in
  the con-leche tree; it runs a prebuilt binary out of the working tree instead of
  cloning, so the environment variables below must be set by the driver.
version: "local worktree build"
# Simple checker (no `url`, no `dir`): lka.py creates an empty build directory
# and runs `run` there with $IN pointing at the export.  Every path is absolute
# and comes from the environment, so nothing depends on that directory.
run: |
  set -u
  ulimit -v "${CON_LECHE_VLIMIT:-16000000}"
  # SCRATCH.  A run writes no scratch file at all (task #180/#207).
  # `TMPDIR` is still pointed at disk here, as the project's standing rule
  # for anything that does need scratch.
  # (the driver always sets CON_LECHE_TMPDIR; the fallback is `./_tmp/tmp`, the
  # project's on-disk scratch convention, never the system temp directory)
  export TMPDIR="${CON_LECHE_TMPDIR:-$PWD/_tmp/tmp}"
  mkdir -p "$TMPDIR"
  timeout "${CON_LECHE_TIMEOUT:-3000}" \
    "${CON_LECHE_BIN:?CON_LECHE_BIN must point at the con-leche binary}" \
    "${CON_LECHE_MODE:---verified}" "$IN"
