name = "setlec"
defaultTargets = ["SetlecBase", "SetlecR", "SetlecP", "SetlecCaps", "setlec"]
testDriver = "SetlecTests"

# THE SEPARATION (task #161) — the ruled four-lib layout, staged.
#
#             SetlecBase
#   Kernel/* · model-free Verify/* · SetTheory/* · TT/*
#   SetBase/* (the lane-neutral semantic primitives)
#        ↑                      ↑
#    SetlecR                SetlecP
#   EnvS · Sound/* ·       de-based EnvS2Core · Annot
#   Install/* · the 2U     carriers · Interp2 rows ·
#   lane · R + R2          self-standing fold · P capstone
#        ↑                      ↑
#             SetlecCaps (exe/capstones)
#
# STAGING NOTE (S2).  The four-lib layout is now COMPLETE: S2 moved the
# graded lane's 115 modules to `Setlec/SetP/*` and `SetlecP` is a target.
# Eleven P→R edges survive, each on `tests/layering.sh`'s whitelist
# tagged with the batch (S3/S4/S7) that removes it; they are the
# de-basing's work order, and the whitelist may only ever shrink.
#
# HONESTY NOTE about "cross-import = build error" (S1 finding).  Lake
# does NOT give an import barrier between `lean_lib`s of the SAME
# package: import resolution is per-package, so a module in one lib may
# import a module rooted in another (today `Setlec.SetR.*` imports
# `Setlec.Kernel.*` across exactly such a boundary).  The lib split is
# therefore the layout, not the fence; `tests/layering.sh` is the fence.
# A hard build error would need the lanes to become separate Lake
# *packages* (`require ... from "..."`), which is a lakefile-level
# decision left to the campaign's succession (see DESIGN.md S1 seal).

# The pin-generator's certificate theorems (Setlec/PinGen/Certs.lean) are
# a classic (non-`module`) library: the proofs unfold core definition
# bodies, which the module system hides.  `Setlec/Kernel/NatOpPins.lean`
# loads the built olean into the generator's full-view environment at
# elaboration time, so it must be built first — hence the
# `extraDepTargets` below.
[[lean_lib]]
name = "SetlecPinCerts"
roots = ["Setlec.PinGen.Certs"]

# The shared base: the checker itself (`Setlec.Kernel.*`), the model-free
# verification tier (`Setlec.Verify.*`), the `SetTheory` interface, the
# declarative type-theory layer (`Setlec.TT.*`, task #74 — its own module
# hierarchy, importing nothing from the checker), and `Setlec.SetBase.*`
# (task #161 S1: the six lane-neutral semantic primitives).  Both model
# lanes stand on this and nothing here may import either lane.
[[lean_lib]]
name = "SetlecBase"
roots = ["Setlec", "Setlec.TT", "Setlec.SetBase"]
extraDepTargets = ["SetlecPinCerts"]

# The collapsed-model lane (task #148's mode-indexed relation family and
# everything above it): `Rel`, `Sound/*`, `EnvS`, `Install/*`, `Bridge/*`,
# the `R` capstones in `Main.lean` and — per the task-#161 ruling
# "everything EnvS-containing lives in R" — the 2U/`denote2` tier and its
# `R2` capstones in `Main2.lean`.  Since S2 this lib roots the collapsed
# lane ALONE.
[[lean_lib]]
name = "SetlecR"
roots = ["Setlec.SetR"]

# The graded-model lane (task #161 S2): the `AnnotOk2` bit carriers, the
# de-basing's `EnvS2Core`/`EnvS2P`, the per-rule `…P` quarters and rows,
# the basis/inductive/projection install `…P` families, `FoldP` and
# `CapstoneP`.  Stands on `SetlecBase`; may not import `SetlecR` (the
# eleven surviving edges are whitelisted in `tests/layering.sh`).  Only
# the file paths moved — the Lean namespaces are `Setlec.SetR.{Interp2,
# Annot}` still, so no frozen statement changed name.
[[lean_lib]]
name = "SetlecP"
roots = ["Setlec.SetP"]

# The capstone assembly (task #163): the cached checker variant's
# verification tier — the `ExprC` erasure/field-exactness seam, the `SimC`
# simulation, and the consistency corollaries for `--core=cached-parsed`.
# `Verify/Cached/MainC.lean` is the two-lane assembly and is the ONLY
# module allowed to see both lanes.
[[lean_lib]]
name = "SetlecCaps"
roots = ["Setlec.Verify.Cached"]

[[lean_lib]]
name = "SetlecTests"
srcDir = "tests"

[[lean_exe]]
name = "setlec"
root = "Main"
extraDepTargets = ["SetlecPinCerts"]

[[lean_exe]]
name = "annotate-basis"
root = "AnnotateBasis"
extraDepTargets = ["SetlecPinCerts"]
