name = "setlec"
defaultTargets = ["Setlec", "SetlecTT", "SetlecTTV", "setlec"]
testDriver = "SetlecTests"

# The pin-generator's certificate theorems (Setlec/PinGen/Certs.lean) are
# a classic (non-`module`) library: the proofs unfold core definition
# bodies, which the module system hides.  `Setlec/Kernel/NatOpPins.lean`
# loads the built olean into the generator's full-view environment at
# elaboration time, so it must be built first — hence the
# `extraDepTargets` below.
[[lean_lib]]
name = "SetlecPinCerts"
roots = ["Setlec.PinGen.Certs"]

[[lean_lib]]
name = "Setlec"
extraDepTargets = ["SetlecPinCerts"]

# The declarative type-theory layer (task #74).  Its own module
# hierarchy: `Setlec.TT.{Syntax,Subst,Const,Judgment}` import nothing
# from the checker, and `Setlec.TT.Semantics.*` import only
# `Setlec.SetTheory.*`.  Nothing in the checker imports it yet, so it
# needs its own library target to be built at all.
[[lean_lib]]
name = "SetlecTT"
roots = ["Setlec.TT"]

# The TTVerify bridge (task #119): the denotation of a real `Env`+`Expr`
# into the declarative layer, the transposed environment invariant, and
# the acceptance theorem.  Imports `Setlec` and `SetlecTT`; nothing in
# the checker imports it back.
[[lean_lib]]
name = "SetlecTTV"
roots = ["Setlec.TTVerify"]

[[lean_lib]]
name = "SetlecTests"
srcDir = "tests"

[[lean_exe]]
name = "setlec"
root = "Main"
extraDepTargets = ["SetlecPinCerts"]

[[lean_exe]]
name = "annotate-basis"
root = "AnnotateBasis"
extraDepTargets = ["SetlecPinCerts"]
