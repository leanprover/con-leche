name = "setlec"
defaultTargets = ["SetlecBase", "SetlecP", "SetlecCaps", "setlec", "setlec-preprocess"]
testDriver = "SetlecTests"

# THE PREPROCESSOR, AS A LIBRARY (task #178).  `lean-inductive-models` reduces
# an export's inductives to its five-member basis; since its `45d1346` it is
# also a Lean library, `InductiveModels.main args (native := pred)`, whose
# `pred` says which inductive blocks the *consumer* handles itself.  setlec's
# direct simple-structure path handles a whole class of them, so the checker
# ships its own front end for the tool — `setlec-preprocess`, below — and
# spawns that instead of the stock binary.
#
# The pin is a commit, not a branch: the predicate mirrors a recogniser
# (`Setlec/Kernel/Direct/Parts.lean`) and both sides of that mirror have to
# move deliberately.  Nothing in the `Setlec.*` libraries imports this
# dependency: it is the `setlec-preprocess` executable's alone, so the layering
# gate and the proof-dependency pin are untouched by it.
[[require]]
name = "lean_inductive_models"
git = "https://github.com/nomeata/lean-inductive-models"
rev = "45d134663faec16f13b4885f4a5a11bdd08de1b2"

# THE SEPARATION (task #161) — the ruled lib layout, as it stands after
# the SetR removal (user ruling 2026-09-05, "do remove the SetR tier,
# for more focus").
#
#             SetlecBase
#   Kernel/* · model-free Verify/* · SetTheory/* · TT/*
#   SetModel/* (pure set constructions) · Semantics/* (Expr-facing
#   denotation and claims; the two halves of the former SetBase/*)
#                               ↑
#                           SetlecP
#                   de-based EnvS2Core · Annot
#                   carriers · Interp2 rows ·
#                   self-standing fold · P capstone
#                               ↑
#             SetlecCaps (exe/capstones)
#
# HISTORY.  The layout was a FOUR-lib one until 2026-09-05: `SetlecR`
# rooted `Setlec.SetR` — the collapsed-model consistency proof for the
# R core (`EnvS`, `Sound/*`, `Install/*`, the `R`/`R2`/`R2M` capstones).
# The B4 measurement had shown a ZERO acceptance delta between the two
# verified configurations (225 fixtures + init-full byte-identical), so
# the graded lane's `no_proof_of_Empty_SPCD_P` covers the shipped path
# alone and the collapsed lane was retired whole.  The separation
# campaign (task #161) had left the two trees genuinely disjoint — zero
# edges in either direction — which is why the cut was clean: only
# `Verify/Cached/MainC` and `tests/ProofDeps` had to change at all.
#
# HONESTY NOTE about "cross-import = build error" (S1 finding).  Lake
# does NOT give an import barrier between `lean_lib`s of the SAME
# package: import resolution is per-package, so a module in one lib may
# import a module rooted in another (today `Setlec.SetP.*` imports
# `Setlec.Kernel.*` across exactly such a boundary).  The lib split is
# therefore the layout, not the fence; `tests/layering.sh` is the fence.
# A hard build error would need the lanes to become separate Lake
# *packages* (`require ... from "..."`), which is a lakefile-level
# decision left to the campaign's succession (see DESIGN.md S1 seal).
#
# S8's RULING on that succession item, now that the whitelist is empty:
# **it stays a named follow-up, not this batch's work.**  Package
# separation is no longer a de-basing question (there is nothing left
# to de-base) but a build-system one: three packages sharing one
# toolchain and one `.lake`, with `require` edges, changes how every
# target, the test driver and the two executables are named and built,
# and it buys a *stronger form of a property the tree already has*
# rather than a property it lacks.  The honest trade: `tests/layering.sh`
# enforces the fence at zero cost inside the standard battery and
# cannot be bypassed by adding an import, while the package split would
# make the fence structural at the cost of a lakefile rewrite whose
# failure modes (stale inter-package oleans, a split `.lake`) are new
# and would land on top of a green tree.  Recorded; not attempted.

# The pin-generator's certificate theorems (Setlec/PinGen/Certs.lean) are
# a classic (non-`module`) library: the proofs unfold core definition
# bodies, which the module system hides.  `Setlec/Kernel/NatOpPins.lean`
# loads the built olean into the generator's full-view environment at
# elaboration time, so it must be built first — hence the
# `extraDepTargets` below.
[[lean_lib]]
name = "SetlecPinCerts"
roots = ["Setlec.PinGen.Certs"]

# The shared base: the checker itself (`Setlec.Kernel.*`), the model-free
# verification tier (`Setlec.Verify.*`), the `SetTheory` interface, the
# declarative type-theory layer (`Setlec.TT.*`, task #74 — its own module
# hierarchy, importing nothing from the checker), `Setlec.SetModel.*`
# (the pure set constructions) and `Setlec.Semantics.*` (the Expr-facing
# denotation and claims) — the two halves the former `Setlec.SetBase.*`
# (task #161 S1) was split into on 2026-09-06.  The model lane stands on
# this and nothing here may import it.
[[lean_lib]]
name = "SetlecBase"
roots = ["Setlec", "Setlec.TT", "Setlec.SetModel", "Setlec.Semantics"]
extraDepTargets = ["SetlecPinCerts"]

# The graded-model lane (task #161 S2): the `AnnotOk2` bit carriers, the
# de-basing's `EnvS2Core`/`EnvS2P`, the per-rule `…P` quarters and rows,
# the basis/inductive/projection install `…P` families, `FoldP` and
# `CapstoneP`.  Stands on `SetlecBase`; since the SetR removal it is the
# ONLY model lane.  Only the file paths ever moved — the Lean namespaces
# are `Setlec.SetR.{Interp2, Annot}` still, so no frozen statement
# changed name.
[[lean_lib]]
name = "SetlecP"
roots = ["Setlec.SetP"]

# The capstone assembly (task #163): the cached checker variant's
# verification tier — the `ExprC` erasure/field-exactness seam, the `SimC`
# simulation, and the consistency corollaries for `--core=cached-parsed`.
# `Verify/Cached/MainC.lean` carries the shipped driver's capstone; it
# was the two-lane assembly until the SetR removal left one lane.
[[lean_lib]]
name = "SetlecCaps"
roots = ["Setlec.Verify.Cached"]

[[lean_lib]]
name = "SetlecTests"
srcDir = "tests"

[[lean_exe]]
name = "setlec"
root = "Main"
extraDepTargets = ["SetlecPinCerts"]

[[lean_exe]]
name = "annotate-basis"
root = "AnnotateBasis"
extraDepTargets = ["SetlecPinCerts"]

# The checker's own front end for `lean-inductive-models` (task #178): the
# tool's `main`, passed setlec's `NativeSupport`.  `supportInterpreter` because
# the tool imports `Lean` and replays declarations through the kernel, exactly
# as its own executable target does upstream.  It imports no `Setlec.*` module
# — the predicate is a documented mirror of `Setlec.directPartsCore?`, gated by
# `tests/native-agree.sh`, not a shared definition (the two sides speak
# different `Expr` types).
[[lean_exe]]
name = "setlec-preprocess"
root = "SetlecPreprocess"
supportInterpreter = true
