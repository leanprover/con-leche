name = "setlec"
defaultTargets = ["Setlec", "SetlecTT", "SetlecSetR", "SetlecCachedV", "setlec"]
testDriver = "SetlecTests"

# The pin-generator's certificate theorems (Setlec/PinGen/Certs.lean) are
# a classic (non-`module`) library: the proofs unfold core definition
# bodies, which the module system hides.  `Setlec/Kernel/NatOpPins.lean`
# loads the built olean into the generator's full-view environment at
# elaboration time, so it must be built first — hence the
# `extraDepTargets` below.
[[lean_lib]]
name = "SetlecPinCerts"
roots = ["Setlec.PinGen.Certs"]

[[lean_lib]]
name = "Setlec"
extraDepTargets = ["SetlecPinCerts"]

# The declarative type-theory layer (task #74).  Its own module
# hierarchy: `Setlec.TT.{Syntax,Subst,Const,Judgment}` import nothing
# from the checker, and `Setlec.TT.Semantics.*` import only
# `Setlec.SetTheory.*`.  Nothing in the checker imports it yet, so it
# needs its own library target to be built at all.
[[lean_lib]]
name = "SetlecTT"
roots = ["Setlec.TT"]

# The mode-indexed algorithmic relation family (task #148): the
# `Red`/`Infer`/`DefEq`/`Tele`/`DefEqL` mutual family on the env-free TT
# syntax, its weakening metatheory, and the `DeclR` per-kind relation
# statements.  Imports `Setlec` (kernel + Verify) and `SetlecTT`; nothing
# imports it back.
[[lean_lib]]
name = "SetlecSetR"
roots = ["Setlec.SetR"]

# The cached checker variant's verification tier (task #163): the
# `ExprC` erasure/field-exactness seam, the `SimC` simulation of the
# cached core against the pure fueled checker, and the consistency
# corollaries for `--core=cached-parsed`.  Imports `Setlec` (and, at
# the capstone, `SetlecSetR`); nothing imports it back.
[[lean_lib]]
name = "SetlecCachedV"
roots = ["Setlec.Verify.Cached"]

[[lean_lib]]
name = "SetlecTests"
srcDir = "tests"

[[lean_exe]]
name = "setlec"
root = "Main"
extraDepTargets = ["SetlecPinCerts"]

[[lean_exe]]
name = "annotate-basis"
root = "AnnotateBasis"
extraDepTargets = ["SetlecPinCerts"]
